# Local PostgreSQL and ClickHouse for docs/quickstart.md

name: walshadow-quickstart

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=8
      - -c
      - wal_keep_size=128MB
    volumes:
      - ./init/quickstart:/docker-entrypoint-initdb.d:ro
      # PostgreSQL 18 stores data below major-version subdirectory
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  walshadow:
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      - WALSHADOW_PG_URL=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - WALSHADOW_CH_URL=clickhouse://default@clickhouse:9000/walshadow

volumes:
  postgres-data:
  clickhouse-data:
