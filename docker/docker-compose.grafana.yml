# Optional browser status layer for docker/docker-compose.yml

services:
  prometheus:
    image: prom/prometheus:v3.12.0
    depends_on:
      walshadow:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${WALSHADOW_PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.0.2
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/walshadow.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${WALSHADOW_GRAFANA_PORT:-3000}:3000"
