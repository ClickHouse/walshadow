# walshadow dashboard demo overlay. Layer ON TOP of docker-compose.yml:
#
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.demo.yml up --build -d
#
# Adds the observability + load-generation tier on top of the lean
# source→walshadow→clickhouse base:
#   pgbench           — hammers source with the TPC-B workload. NOT started by
#                       default (profile `load`); the UI's START WRITE LOAD
#                       button runs the same workload on demand instead
#   postgres-exporter — source PG stats (TPS, tuple write rates) → Prom
#   prometheus        — scrapes walshadow:9484 + postgres-exporter:9187
#   grafana           — http://localhost:3000, anonymous-admin, lands on
#                       the "walshadow — live CDC pipeline" dashboard
#   ui                — http://localhost:8088, the click-to-drive surface:
#                       write controls, rowcount parity, live schema
#
# The base services are extended (not replaced): the env toggles below
# arm the demo-only init steps (init/source/02-pgbench.sh,
# init/clickhouse/02-pgbench.sh — no-ops without WALSHADOW_DEMO_PGBENCH)
# and repoint walshadow at the pgbench-aware ch-config + a 1s status
# cadence so the graphs move in near-real-time.
#
# Those two init scripts are ALSO run by the source-init / ch-init
# one-shot services below, which walshadow gates on. The env toggle alone
# is not enough: docker-entrypoint-initdb.d hooks fire only on an empty
# data dir, so a volume left over from the lean base stack never grows the
# pgbench tables and walshadow's preflight rejects the demo ch-config's
# pinned relations ("mapped relation public.pgbench_* not found on
# source"). The one-shot services make seeding idempotent and independent
# of volume state.

services:
  source:
    environment:
      WALSHADOW_DEMO_PGBENCH: "1"
      PGBENCH_SCALE: "${PGBENCH_SCALE:-1}"

  clickhouse:
    environment:
      WALSHADOW_DEMO_PGBENCH: "1"

  # One-shot seeders. Re-run the demo init scripts over TCP on every `up`
  # so the pgbench schema and its CH destination tables exist regardless
  # of whether the data volumes were fresh. Both are idempotent: the
  # source side skips `pgbench -i` when the four tables are already there,
  # the CH side is all CREATE IF NOT EXISTS.
  source-init:
    image: postgres:18-bookworm
    depends_on:
      source:
        condition: service_healthy
    environment:
      WALSHADOW_DEMO_PGBENCH: "1"
      PGBENCH_SCALE: "${PGBENCH_SCALE:-1}"
      PGHOST: source
      PGUSER: postgres
      PGDATABASE: postgres
    volumes:
      - ./init/source/02-pgbench.sh:/seed.sh:ro
    entrypoint: ["/bin/bash", "/seed.sh"]
    restart: "no"

  ch-init:
    image: clickhouse/clickhouse-server:26.3
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      WALSHADOW_DEMO_PGBENCH: "1"
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - ./init/clickhouse:/seed:ro
    # 01-schema.sql carries demo.users, the schema-change narrative table;
    # it is volume-gated the same way, so assert it here too.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        until clickhouse-client --host clickhouse --query "SELECT 1" >/dev/null 2>&1; do sleep 1; done
        clickhouse-client --host clickhouse --queries-file /seed/01-schema.sql
        exec bash /seed/02-pgbench.sh
    restart: "no"

  walshadow:
    depends_on:
      source-init:
        condition: service_completed_successfully
      ch-init:
        condition: service_completed_successfully
    environment:
      RUST_LOG: warn,walshadow=info
      WALSHADOW_STATUS_INTERVAL: "1"
      WALSHADOW_CH_CONFIG: /etc/walshadow/ch-config.demo.toml
    volumes:
      - ./ch-config.demo.toml:/etc/walshadow/ch-config.demo.toml:ro

  # OFF by default — `profiles` keeps this out of a plain `up`, so the stack
  # comes up quiet and the operator arms the load from the UI (which runs its
  # own pgbench child process; see ui/app.py PgbenchLoad). Still available as a
  # standalone hammer that starts with the stack and needs no browser:
  #
  #   $dc --profile load up -d          # or: $dc --profile load up -d pgbench
  #
  # Running both at once is legal but the two loads simply add up.
  pgbench:
    profiles: ["load"]
    image: postgres:18-bookworm
    depends_on:
      source:
        condition: service_healthy
      walshadow:
        condition: service_started
    environment:
      PGBENCH_CLIENTS: "${PGBENCH_CLIENTS:-4}"
      PGBENCH_THREADS: "${PGBENCH_THREADS:-2}"
      PGBENCH_DURATION: "${PGBENCH_DURATION:-86400}"
    entrypoint: ["/bin/bash", "-c"]
    # `$$` escapes the compose-interpolation pass so these expand from
    # the container's env at runtime, not from the host shell at config
    # time (which would blank them).
    command:
      - |
        set -euo pipefail
        echo "pgbench: waiting for source PG ..."
        until pg_isready -h source -U postgres -d postgres >/dev/null 2>&1; do sleep 1; done
        echo "pgbench: waiting for walshadow bootstrap (metrics port 9484) ..."
        until (echo > /dev/tcp/walshadow/9484) 2>/dev/null; do sleep 1; done
        sleep 2
        echo "pgbench: hammering source (-c $${PGBENCH_CLIENTS} -j $${PGBENCH_THREADS} for $${PGBENCH_DURATION}s)"
        exec pgbench -h source -U postgres -d postgres -n \
            -c "$${PGBENCH_CLIENTS}" -j "$${PGBENCH_THREADS}" \
            -T "$${PGBENCH_DURATION}" -P 5

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    depends_on:
      source:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres@source:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"

  prometheus:
    image: prom/prometheus:v3.12.0
    depends_on:
      - postgres-exporter
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    ports:
      - "9090:9090"

  # The click-to-drive UI — http://localhost:8088. Grafana stays the
  # time-series view; this is the one you drive the demo from: write controls
  # against source demo.users, rowcount parity against ClickHouse, and the
  # live schema tables that show the ALTER landing downstream.
  #
  # Reads walshadow's /metrics over HTTP. That port opens only AFTER preflight
  # + bootstrap, so this must NOT gate on it the way `pgbench` does — the page
  # has to paint immediately and say "bootstrapping" instead. Hence
  # `service_started`, and hence app.py degrading every walshadow tile to an
  # em-dash while the controls and parity panels stay fully live (they only
  # need source PG and ClickHouse).
  ui:
    build:
      context: ./ui
    depends_on:
      source:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      walshadow:
        condition: service_started
    environment:
      # trust auth on source (POSTGRES_HOST_AUTH_METHOD=trust) → no password
      WALSHADOW_UI_PG_DSN: "postgresql://postgres@source:5432/postgres?application_name=walshadow-ui"
      WALSHADOW_UI_CH_URL: "http://clickhouse:8123"
      WALSHADOW_UI_METRICS_URL: "http://walshadow:9484/metrics"
      WALSHADOW_UI_POLL_INTERVAL: "1.0"
      WALSHADOW_UI_MAX_INSERT_ROWS: "5000000"
      WALSHADOW_UI_CHUNK_ROWS: "250000"
      # Bounded on purpose. An unbounded `UPDATE demo.users SET signup_ts =
      # now()` after a million-row insert rewrites a million tuples under
      # REPLICA IDENTITY FULL — full old *and* new images, hundreds of MB of
      # WAL in one transaction. 100 rows proves the new column's values ship
      # just as well. See the app.py docstring.
      WALSHADOW_UI_DDL_UPDATE_ROWS: "100"
      WALSHADOW_UI_RECENT_ROWS: "12"
      # START WRITE LOAD spawns `pgbench` in this container against source.
      # Same knobs as the (now profile-gated) pgbench service, so a demo tuned
      # with PGBENCH_CLIENTS on the CLI behaves identically from the button.
      WALSHADOW_UI_PGBENCH_HOST: source
      WALSHADOW_UI_PGBENCH_CLIENTS: "${PGBENCH_CLIENTS:-4}"
      WALSHADOW_UI_PGBENCH_THREADS: "${PGBENCH_THREADS:-2}"
      WALSHADOW_UI_PGBENCH_DURATION: "${PGBENCH_DURATION:-86400}"
    volumes:
      # COPYed into the image too; these mounts make editing a `restart`
      # rather than a rebuild.
      - ./ui/app.py:/app/app.py:ro
      - ./ui/index.html:/app/index.html:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8088/healthz').read()"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "8088:8088"

  grafana:
    image: grafana/grafana:13.0.2
    depends_on:
      - prometheus
      - clickhouse
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/walshadow.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
