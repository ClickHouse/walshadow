# walshadow demo CH emitter mapping — observability variant. replicate_all
# (on by default) auto-creates demo.users; the explicit pgbench mappings pin
# dest types to the tables pre-created by init/clickhouse/02-pgbench.sh.

[ch]
host = "clickhouse"
port = 9000
database = "demo"
user = "default"
password = ""
compression = "lz4"
flush_timeout_ms = 200

[table.public.pgbench_accounts]
target_database = "demo"
columns = [
    { attnum = 1, target = "aid",      type = "Int32"  },
    { attnum = 2, target = "bid",      type = "Int32"  },
    { attnum = 3, target = "abalance", type = "Int32"  },
    { attnum = 4, target = "filler",   type = "String" },
]

[table.public.pgbench_branches]
target_database = "demo"
columns = [
    { attnum = 1, target = "bid",      type = "Int32" },
    { attnum = 2, target = "bbalance", type = "Int32" },
    { attnum = 3, target = "filler",   type = "Nullable(String)" },
]

[table.public.pgbench_tellers]
target_database = "demo"
columns = [
    { attnum = 1, target = "tid",      type = "Int32" },
    { attnum = 2, target = "bid",      type = "Int32" },
    { attnum = 3, target = "tbalance", type = "Int32" },
    { attnum = 4, target = "filler",   type = "Nullable(String)" },
]

[table.public.pgbench_history]
target_database = "demo"
columns = [
    { attnum = 1, target = "tid",    type = "Int32" },
    { attnum = 2, target = "bid",    type = "Int32" },
    { attnum = 3, target = "aid",    type = "Int32" },
    { attnum = 4, target = "delta",  type = "Int32" },
    { attnum = 5, target = "mtime",  type = "DateTime64(6)" },
    { attnum = 6, target = "filler", type = "Nullable(String)" },
]
