# walshadow quickstart — replicate your own Postgres into your own
# ClickHouse. One service: the daemon, plus the shadow PG it owns inside the
# container. Walkthrough in docker/QUICKSTART.md
#
#   export WALSHADOW_SOURCE_URL=postgres://user:password@host:5432/dbname
#   export WALSHADOW_CH_URL=clickhouse://user:password@host:9000/database
#   docker compose -f docker/docker-compose.yml run --rm walshadow init
#   docker compose -f docker/docker-compose.yml up --build -d
#   docker compose -f docker/docker-compose.yml logs -f walshadow   # wait for bootstrap
#   docker compose -f docker/docker-compose.yml \
#       -f docker/docker-compose.grafana.yml up -d                  # browser status
#
# The shadow is a physical clone of the source, so the image's PostgreSQL
# major must equal the source's. Anything but 18:
#
#   PG_MAJOR=17 docker compose -f docker/docker-compose.yml up --build -d

name: walshadow

services:
  walshadow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
    environment:
      - RUST_LOG=${RUST_LOG:-warn,walshadow=info}
      # Bare names pass the shell's value through, so an unset URL stays unset
      - WALSHADOW_SOURCE_URL
      - WALSHADOW_CH_URL
    ports:
      - "${WALSHADOW_METRICS_PORT:-9484}:9484"
    volumes:
      # WAL segments, spill files, and the shadow data dir. Losing it costs a
      # rebootstrap, not correctness
      - walshadow-data:/var/lib/walshadow
      # `init` writes ch-config.toml here; `ctl` writes its fragments beside it
      - walshadow-config:/etc/walshadow
    stop_grace_period: 30s

volumes:
  walshadow-data:
  walshadow-config:
