name: Release

# Build the walshadow-stream / walshadow-classify / walshadow-filter binaries
# and the pgext loadable module for linux x86_64 + aarch64, and publish them.
#
#   main push   -> one tar.gz per target as workflow artifacts
#   v* tag push -> same archives + SHA256SUMS attached to a GitHub Release,
#                  with a build-provenance attestation per archive
#
# Each arch builds natively on its own runner, same as docker.yml. Dynamic
# glibc link: the binaries need a glibc no newer than the oldest consumer's.
# The clickgres walshadow VM image is Ubuntu 22.04 (glibc 2.35), so the
# unsuffixed archives build on 22.04 runners; moving them forward strands every
# VM already running that image.
# Ubuntu 26.04 builds alongside them under an `-ubuntu26.04` suffix, for
# images new enough to prefer a native build.
#
# Archive layout: walshadow-<version>-<target>[-ubuntu26.04]/{walshadow-*,
# LICENSE,README.md} and walshadow-pgext-<version>-pg<major>-<target>[
# -ubuntu26.04]/{walshadow.so,LICENSE}, where <version> is the tag without its
# `v`, or `sha-<short>` on main, the same commit tag scheme docker.yml uses.
#
# pgext ships per PG major because it is compiled against that major's server
# headers. The majors here are the ones the VM image caches; a shadow running
# any other major cannot be upgraded from a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build only, no release. Paths that change how the archives are produced
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.rs
      - vendor/mimalloc
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image.target }} ${{ matrix.image.runner }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            suffix: ""
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            suffix: -ubuntu26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            suffix: -ubuntu26.04
    runs-on: ${{ matrix.image.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout walshadow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.image.target }}

      # The runner image belongs in the key: rust-cache keys on runner.os and
      # the host triple, both identical across ubuntu releases, so a cache
      # filled on a newer image hands this job dependency rlibs compiled
      # against a newer glibc, and the link fails on symbols like
      # __isoc23_sscanf that this image cannot resolve.
      - name: Cargo cache
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: release-${{ matrix.image.target }}-${{ matrix.image.runner }}

      - name: Install C deps (lz4 + zstd for clickhouse-c-rs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential liblz4-dev libzstd-dev

      # Tags must match Cargo.toml so the archive name, the release and
      # `--version` agree on what version this is.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          crate=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "walshadow") | .version')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$crate" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
              exit 1
            fi
          else
            version="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=walshadow-$version-${{ matrix.image.target }}${{ matrix.image.suffix }}" >> "$GITHUB_OUTPUT"

      # `-p walshadow --bins`: the bench workspace member has bins too, keep
      # them out of the release. build.rs picks up the git sha for --version.
      - name: Build
        run: cargo build --release --locked -p walshadow --bins --target ${{ matrix.image.target }}

      - name: Smoke test
        run: |
          set -euo pipefail
          for bin in walshadow-stream walshadow-classify walshadow-filter; do
            "target/${{ matrix.image.target }}/release/$bin" --version
          done

      - name: Package
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ARCHIVE"
          cp target/${{ matrix.image.target }}/release/walshadow-{stream,classify,filter} \
             LICENSE README.md "dist/$ARCHIVE/"
          cp vendor/mimalloc/LICENSE "dist/$ARCHIVE/LICENSE-mimalloc"
          tar -czf "dist/$ARCHIVE.tar.gz" -C dist "$ARCHIVE"
          ls -l dist/*.tar.gz

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.version.outputs.archive }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  pgext:
    name: pgext pg${{ matrix.pg-major }} ${{ matrix.image.target }} ${{ matrix.image.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg-major: [16, 17, 18, 19]
        include:
          - pg-major: 16
            pg-floor: "16.15"
          - pg-major: 17
            pg-floor: "17.11"
          - pg-major: 18
            pg-floor: "18.6"
          - pg-major: 19
            pg-floor: "19.0"
        image:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: ""
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            suffix: ""
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
            suffix: -ubuntu26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
            suffix: -ubuntu26.04
    runs-on: ${{ matrix.image.runner }}
    timeout-minutes: 30

    steps:
      # pg-clickhouse-c is a recursive submodule native.o compiles against.
      - name: Checkout walshadow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # Build against the oldest minor the fleet runs: a module built on newer
      # headers can need symbols older minors lack (heap_datum_check from
      # 16.16/17.12/18.7). Only the -dev package matters: PGXS reads pg_config.
      - name: Install PostgreSQL ${{ matrix.pg-floor }} headers (PGDG archive)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl gnupg lsb-release
          curl -fsSL --retry 5 --retry-all-errors https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgres-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgres-archive-keyring.gpg] https://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main ${{ matrix.pg-major }}" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          echo "deb [signed-by=/usr/share/keyrings/postgres-archive-keyring.gpg] https://apt-archive.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg-archive main" \
            | sudo tee /etc/apt/sources.list.d/pgdg-archive.list
          sudo apt-get update
          pkg=postgresql-server-dev-${{ matrix.pg-major }}
          ver=$(apt-cache madison "$pkg" | awk -v f="${{ matrix.pg-floor }}-" 'index($3, f) == 1 {print $3}' | sort -V | tail -1)
          test -n "$ver"
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "$pkg=$ver" "postgresql-client-${{ matrix.pg-major }}=$ver"
          /usr/lib/postgresql/${{ matrix.pg-major }}/bin/pg_config --version | grep "^PostgreSQL ${{ matrix.pg-floor }} "

      # `build` validates a tag against Cargo.toml; this only has to agree
      # with the version string that job produces.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-$(git rev-parse --short HEAD)"
          fi
          echo "archive=walshadow-pgext-$version-pg${{ matrix.pg-major }}-${{ matrix.image.target }}${{ matrix.image.suffix }}" >> "$GITHUB_OUTPUT"

      # with_llvm=no matches the VM image build: no bitcode, so no clang
      # matching the server's LLVM is needed.
      - name: Build
        run: make -C pgext with_llvm=no PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg-major }}/bin/pg_config

      - name: Package
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p "dist/$ARCHIVE"
          cp pgext/walshadow.so LICENSE "dist/$ARCHIVE/"
          tar -czf "dist/$ARCHIVE.tar.gz" -C dist "$ARCHIVE"
          ls -l dist/*.tar.gz

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.version.outputs.archive }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pgext]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Fetch archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: walshadow-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Verify with: gh attestation verify <archive> --repo ClickHouse/walshadow
      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*.tar.gz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
