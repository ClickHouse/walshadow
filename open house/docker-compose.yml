name: openhouse

services:
  postgres:
    image: postgres:17
    environment:
      # The shadow is a physical clone, so it inherits these roles, and the
      # image entrypoint connects to it as postgres/postgres. Renaming either
      # breaks the shadow, not just the source.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=16
      - -c
      - max_replication_slots=16
      - -c
      - wal_compression=lz4
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=1GB
      # safety valve: if the consumer stalls, drop the slot rather than fill
      # the disk. Losing the stream is recoverable; a full data volume is not.
      - -c
      - max_slot_wal_keep_size=32GB
      - -c
      - max_connections=400
      - -c
      - shared_buffers=512MB
    volumes:
      - ./docker/pg-init.sh:/docker-entrypoint-initdb.d/10-replication-hba.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${OPENHOUSE_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: openhouse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
    ports:
      - "${OPENHOUSE_CH_HTTP_PORT:-8123}:8123"
      - "${OPENHOUSE_CH_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8123/ping || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Real replication. The shadow is a physical clone of the source, so the
  # image's PostgreSQL major must equal the source's.
  walshadow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PG_MAJOR: "17"
    environment:
      WALSHADOW_CH_CONFIG: /etc/walshadow/ch-config.toml
      WALSHADOW_DECODER_POOL: ${WALSHADOW_DECODER_POOL:-4}
      WALSHADOW_INSERTER_POOL: ${WALSHADOW_INSERTER_POOL:-3}
      RUST_LOG: ${WALSHADOW_LOG:-warn,walshadow=info}
    volumes:
      - ./docker/walshadow.toml:/etc/walshadow/ch-config.toml:ro
      - walshadow-data:/var/lib/walshadow
    ports:
      - "${OPENHOUSE_WALSHADOW_METRICS_PORT:-9485}:9484"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    stop_grace_period: 30s
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      PG_DSN: postgres://postgres:postgres@postgres:5432/postgres
      CH_URL: http://default:@clickhouse:8123/openhouse
      BIND_ADDR: 0.0.0.0:8080
      DEMO_PROFILE: ${DEMO_PROFILE:-local}
      OPENHOUSE_ROOT: /app
      STATIC_DIR: /app/engine/static
      RESULTS_DIR: /app/results
      RUST_LOG: ${RUST_LOG:-info,market_engine=info}
    volumes:
      - ./results:/app/results
    ports:
      - "${OPENHOUSE_APP_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
  walshadow-data:
