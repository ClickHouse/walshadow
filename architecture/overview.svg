<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
  <title id="title">Streaming topology</title>
  <desc id="desc">Physical WAL splits into original records for row processing and filtered bytes for shadow replay. CatalogCapture reads shadow at held replay boundaries, persists DescriptorLog history and attaches schema events to transactions. Bounded record queue feeds transaction buffering and the parallel commit pipeline, which writes ClickHouse.</desc>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#A3A9CE" stroke-width="1.5"/></marker>
    <marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#E49B5D" stroke-width="1.5"/></marker>
    <marker id="catalog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#85B695" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #ECE1D7; }
    .name { font-family: monospace; font-size: 19px; font-weight: 600; }
    .group { font-size: 19px; font-weight: 700; }
    .label { font-size: 17px; fill: #C1A78E; }
  </style>
  <rect width="1120" height="850" fill="#292522"/>
  <rect x="48" y="168" width="712" height="656" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="62" y="194" class="group"></text>
  <text x="440" y="194" class="group">walshadow-stream process</text>
  <rect x="80" y="32" width="288" height="80" fill="#273142" stroke="#867462" stroke-width="1.3"/>
  <text x="96" y="61" class="name">Source PostgreSQL</text>
  <text x="96" y="85" class="">Physical replication slot</text>
  <path d="M 224 112 V 208" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="240" y="155" class="label">physical WAL</text>
  <rect x="80" y="208" width="288" height="112" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="96" y="237" class="name">SourceFeed → WalStream</text>
  <text x="96" y="261" class="">StreamingWalker + Filter</text>
  <text x="96" y="285" class="">Keep catalogs; no-op user heap</text>
  <rect x="440" y="208" width="288" height="112" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="456" y="237" class="name">Filtered WAL sinks</text>
  <text x="456" y="261" class="">ShadowStreamSink → sender</text>
  <text x="456" y="285" class="">DirSegmentSink → out/&lt;seg&gt;</text>
  <path d="M 368 264 H 440" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="378" y="248" class="label">WAL</text>
  <rect x="816" y="208" width="256" height="336" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="830" y="234" class="group">Shadow PostgreSQL</text>
  <rect x="836" y="264" width="216" height="80" fill="#273142" stroke="#867462" stroke-width="1.3"/>
  <text x="852" y="293" class="name">walreceiver</text>
  <text x="852" y="317" class="">startup replay</text>
  <rect x="836" y="432" width="216" height="80" fill="#273142" stroke="#867462" stroke-width="1.3"/>
  <text x="852" y="461" class="name">Catalog interface</text>
  <text x="852" y="485" class="">worker SCAN + libpq</text>
  <path d="M 728 288 H 836" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="755" y="271" class="label">WAL</text>
  <rect x="80" y="408" width="288" height="44" fill="#403A36" stroke="#867462" stroke-width="1.3"/>
  <text x="96" y="436" class="name">QueueingRecordSink</text>
  <path d="M 336 417 V 443" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 344 417 V 443" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 352 417 V 443" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 224 320 V 408" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="240" y="364" class="label">original records</text>
  <rect x="80" y="528" width="288" height="104" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="96" y="557" class="name">BufferingDecoderSink</text>
  <text x="96" y="581" class="">XactBuffer: heaps + raw WAL</text>
  <text x="96" y="605" class="">Commit / abort, spill to disk</text>
  <path d="M 224 452 V 528" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="240" y="498" class="label">bounded mpsc</text>
  <rect x="440" y="408" width="288" height="112" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="456" y="437" class="name">CatalogCapture</text>
  <text x="456" y="461" class="">Hold WAL at schema boundary</text>
  <text x="456" y="485" class="">Read exact replay position</text>
  <path d="M 728 472 H 836" fill="none" stroke="#85B695" stroke-width="1.8" marker-end="url(#catalog)" marker-start="url(#catalog)"/>
  <text x="751" y="453" class="label">SCAN</text>
  <path d="M 440 572 C 440 556 728 556 728 572 V 628 C 728 644 440 644 440 628 Z M 440 572 C 440 588 728 588 728 572" fill="#422741" stroke="#CF9BC2" stroke-width="1.3"/>
  <text x="456" y="600" class="name">DescriptorLog</text>
  <text x="456" y="626" class="">Schema history by WAL position</text>
  <path d="M 584 520 V 560" fill="none" stroke="#85B695" stroke-width="1.8" marker-end="url(#catalog)"/>
  <path d="M 440 602 H 368" fill="none" stroke="#85B695" stroke-width="1.8" marker-end="url(#catalog)"/>
  <text x="376" y="583" class="label">lookup</text>
  <rect x="80" y="688" width="648" height="104" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="96" y="717" class="name">ReorderSink → parallel commit pipeline</text>
  <text x="96" y="741" class="">DecodeJob → decode[M] → InsertBatcher → inserter[N]</text>
  <text x="96" y="765" class="">SchemaEvent / TRUNCATE use an ordered DDL barrier</text>
  <path d="M 224 632 V 688" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 584 640 V 688" fill="none" stroke="#85B695" stroke-width="1.8" marker-end="url(#catalog)"/>
  <text x="598" y="669" class="label">descriptors</text>
  <path d="M 440 492 H 400 V 556 H 368" fill="none" stroke="#85B695" stroke-width="1.8" marker-end="url(#catalog)"/>
  <text x="388" y="513" class="label" text-anchor="end">events</text>
  <rect x="816" y="688" width="256" height="104" fill="#403A36" stroke="#EBC06D" stroke-width="1.3"/>
  <text x="832" y="717" class="name">ClickHouse</text>
  <text x="832" y="741" class="">Native INSERT connections</text>
  <text x="832" y="765" class="">Separate DDL connection</text>
  <path d="M 728 738 H 816" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="48" y="844" class="label">CatalogCapture runs on pump; queued row processing owns BufferingDecoderSink and ReorderSink</text>
</svg>
