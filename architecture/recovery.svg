  <path d="M 560 688 V 736" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <path d="M 184 736 V 784" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <path d="M 560 736 V 784" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <path d="M 936 736 V 784" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <rect x="48" y="784" width="272" height="112" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="813" class="name">DescriptorLog GC</text>
  <text x="64" y="837" class="">Discard obsolete history</text>
  <text x="64" y="861" class="">below saved replay floor</text>
  <rect x="424" y="784" width="272" height="112" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="440" y="813" class="name">TOAST retirements</text>
  <text x="440" y="837" class="">toast_retires.toml ledger</text>
  <text x="440" y="861" class="">Retire after saved floor</text>
  <rect x="800" y="784" width="272" height="112" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="816" y="813" class="name">Source slot feedback</text>
  <text x="816" y="837" class="">write / flush / apply</text>
  <text x="816" y="861" class="">Also cap by shadow progress</text>
</svg>
