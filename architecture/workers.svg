<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
  <title id="title">Commit pipeline, queues and acknowledgements</title>
  <desc id="desc">One ReorderSink assigns sequence numbers and enqueues slices. A bounded shared DecodeJob queue fans out to M decode tasks. Rows merge into one FIFO BatcherMsg channel and InsertBatcher. A shared InsertBatch queue fans out to N inserters. Register, Placed and Acked events feed AckCollector independently of row flow; only contiguous completed work advances emitter_ack_lsn.</desc>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#A3A9CE" stroke-width="1.5"/></marker>
    <marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#E49B5D" stroke-width="1.5"/></marker>
    <marker id="catalog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#85B695" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #ECE1D7; }
    .name { font-family: monospace; font-size: 19px; font-weight: 600; }
    .group { font-size: 19px; font-weight: 700; }
    .label { font-size: 17px; fill: #C1A78E; }
  </style>
  <rect width="1120" height="1000" fill="#292522"/>
  <rect x="48" y="24" width="624" height="96" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="53" class="name">ReorderSink · record-queue worker</text>
  <text x="64" y="77" class="">Plan committed transaction, attach descriptor + route, assign seq</text>
  <text x="64" y="101" class="">One commit may produce several DecodeJob slices</text>
  <rect x="816" y="24" width="256" height="912" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="830" y="50" class="group">AckCollector · 1 task</text>
  <path d="M 672 72 H 816" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="694" y="52" class="label">Register</text>
  <text x="833" y="116" class="name">seq → commit_lsn</text>
  <text x="833" y="150" class="">Track each work slice</text>
  <text x="833" y="176" class="">Final slice publishes LSN</text>
  <rect x="48" y="168" width="624" height="44" fill="#403A36" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="196" class="name">DecodeJob · bounded shared queue</text>
  <path d="M 640 177 V 203" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 648 177 V 203" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 656 177 V 203" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 360 120 V 168" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="32" y="248" width="656" height="112" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="46" y="274" class="group"></text>
  <text x="152" y="274" class="group">decode pool · M tasks</text>
  <rect x="48" y="284" width="176" height="60" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="313" class="name">decode[1]</text>
  <rect x="272" y="284" width="176" height="60" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="288" y="313" class="name">decode[2]</text>
  <rect x="496" y="284" width="176" height="60" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="512" y="313" class="name">decode[M]</text>
  <path d="M 136 232 H 584" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 360 212 V 232" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 136 232 V 284" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 360 232 V 284" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 584 232 V 284" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 688 312 H 816" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="704" y="294" class="label">Placed</text>
  <text x="833" y="350" class="name">seq → row count</text>
  <text x="833" y="384" class="">After all rows enter</text>
  <text x="833" y="410" class="">BatcherMsg channel</text>
  <path d="M 136 380 H 584" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 136 344 V 380" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 360 344 V 380" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 584 344 V 380" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 360 380 V 408" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="408" width="624" height="44" fill="#403A36" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="436" class="name">BatcherMsg::Rows / FlushAll · FIFO mpsc</text>
  <path d="M 640 417 V 443" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 648 417 V 443" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 656 417 V 443" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 360 452 V 496" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="496" width="624" height="80" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="525" class="name">InsertBatcher · 1 task</text>
  <text x="64" y="549" class="">TableEncoder per table; seal on rows, bytes, deadline, or FlushAll</text>
  <path d="M 360 576 V 616" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="616" width="624" height="44" fill="#403A36" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="644" class="name">InsertBatch · shared queue, any idle inserter</text>
  <path d="M 640 625 V 651" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 648 625 V 651" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 656 625 V 651" fill="none" stroke="#867462" stroke-width="1.5"/>
  <rect x="32" y="696" width="656" height="120" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="46" y="722" class="group"></text>
  <text x="152" y="722" class="group">inserter pool · N tasks</text>
  <rect x="48" y="732" width="176" height="64" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="761" class="name">inserter[1]</text>
  <rect x="272" y="732" width="176" height="64" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="288" y="761" class="name">inserter[2]</text>
  <rect x="496" y="732" width="176" height="64" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="512" y="761" class="name">inserter[N]</text>
  <path d="M 136 680 H 584" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 360 660 V 680" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 136 680 V 732" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 360 680 V 732" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 584 680 V 732" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 688 770 H 816" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="704" y="751" class="label">Acked</text>
  <text x="833" y="704" class="name">seq → inserted rows</text>
  <text x="833" y="738" class="">Only after ClickHouse</text>
  <text x="833" y="764" class="">returns EndOfStream</text>
  <path d="M 136 842 H 584" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 136 796 V 842" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 360 796 V 842" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 584 796 V 842" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 360 842 V 872" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="872" width="624" height="64" fill="#403A36" stroke="#EBC06D" stroke-width="1.3"/>
  <text x="64" y="901" class="name">ClickHouse · N connections, complete Native INSERTs</text>
  <path d="M 832 816 H 1056" fill="none" stroke="#E49B5D" stroke-width="1.5"/>
  <text x="833" y="850" class="">Advance through contiguous</text>
  <text x="833" y="876" class="">completed seqs only</text>
  <text x="833" y="914" class="name">emitter_ack_lsn</text>
  <path d="M 944 936 V 971" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="786" y="994" class="label">Status loop → saved restart floor</text>
  <text x="48" y="971" class="name">M = decoder_pool_size     N = inserter_pool_size</text>
</svg>
