<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" role="img" aria-labelledby="title desc">
  <title id="title">Commit pipeline, queues and acknowledgements</title>
  <desc id="desc">ReorderSink plans commits and places rows inline in commit order. One batcher seals per-table batches. Conversion workers resolve PostgreSQL types before inserters send complete Native blocks to ClickHouse. Bounded queues separate stages. Register, Placed and Acked events track work slices; only contiguous completed work advances emitter_ack_lsn.</desc>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#A3A9CE" stroke-width="1.5"/></marker>
    <marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#E49B5D" stroke-width="1.5"/></marker>
    <marker id="catalog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#85B695" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #ECE1D7; }
    .name { font-family: monospace; font-size: 19px; font-weight: 600; }
    .group { font-size: 19px; font-weight: 700; }
    .label { font-size: 17px; fill: #C1A78E; }
  </style>
  <rect width="1120" height="1040" fill="#292522"/>
  <rect x="48" y="24" width="624" height="112" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="53" class="name">ReorderSink · record-queue worker</text>
  <text x="64" y="79">Plan commits and place rows inline, in commit order</text>
  <text x="64" y="105">Assign sequence numbers to work slices</text>
  <path d="M 360 136 V 184" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="184" width="624" height="44" fill="#403A36" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="212" class="name">Rows + FlushAll · bounded FIFO queue</text>
  <path d="M 640 193 V 219" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 648 193 V 219" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 656 193 V 219" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 360 228 V 276" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="276" width="624" height="80" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="305" class="name">InsertBatcher · 1 task</text>
  <text x="64" y="331">Seal per table on rows, bytes, deadline, or FlushAll</text>
  <path d="M 360 356 V 396" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="396" width="624" height="44" fill="#403A36" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="424" class="name">InsertBatch · bounded shared queue</text>
  <path d="M 640 405 V 431" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 648 405 V 431" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 656 405 V 431" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 360 440 V 480" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="32" y="480" width="656" height="128" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="48" y="507" class="group">Conversion pool · W tasks</text>
  <text x="48" y="532">Convert PostgreSQL types; pass local columns through</text>
  <rect x="48" y="548" width="176" height="44" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="576" class="name">resolver[1]</text>
  <rect x="272" y="548" width="176" height="44" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="288" y="576" class="name">resolver[2]</text>
  <rect x="496" y="548" width="176" height="44" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="512" y="576" class="name">resolver[…]</text>
  <path d="M 360 608 V 648" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="648" width="624" height="44" fill="#403A36" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="676" class="name">ResolvedBatch · bounded shared queue</text>
  <path d="M 640 657 V 683" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 648 657 V 683" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 656 657 V 683" fill="none" stroke="#867462" stroke-width="1.5"/>
  <path d="M 360 692 V 732" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="32" y="732" width="656" height="128" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="48" y="759" class="group">Inserter pool · N tasks</text>
  <text x="48" y="784">Build Native blocks; retain each block across insert retries</text>
  <rect x="48" y="800" width="176" height="44" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="828" class="name">inserter[1]</text>
  <rect x="272" y="800" width="176" height="44" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="288" y="828" class="name">inserter[2]</text>
  <rect x="496" y="800" width="176" height="44" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="512" y="828" class="name">inserter[…]</text>
  <path d="M 360 860 V 900" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="900" width="624" height="64" fill="#403A36" stroke="#EBC06D" stroke-width="1.3"/>
  <text x="64" y="929" class="name">ClickHouse · N connections</text>
  <text x="64" y="953">Complete Native INSERTs</text>
  <rect x="816" y="24" width="256" height="940" fill="#34302C" stroke="#867462" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="832" y="53" class="group">AckCollector · 1 task</text>
  <path d="M 672 72 H 816" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="696" y="60" class="label">Register</text>
  <text x="832" y="110">Track each work slice</text>
  <text x="832" y="136">Final slice carries LSN</text>
  <path d="M 672 206 H 816" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="696" y="194" class="label">Placed</text>
  <text x="832" y="244">Expected row count</text>
  <text x="832" y="270">Sent after rows enter</text>
  <text x="832" y="296">batcher queue</text>
  <path d="M 688 822 H 816" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="704" y="810" class="label">Acked</text>
  <text x="832" y="742">Inserted row count</text>
  <text x="832" y="768">Only after ClickHouse</text>
  <text x="832" y="794">returns EndOfStream</text>
  <path d="M 832 850 H 1056" fill="none" stroke="#E49B5D" stroke-width="1.5"/>
  <text x="832" y="878">Advance through contiguous</text>
  <text x="832" y="904">completed slices only</text>
  <text x="832" y="942" class="name">emitter_ack_lsn</text>
  <path d="M 944 964 V 990" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="800" y="1010" class="label">Status loop persists</text>
  <text x="800" y="1032" class="label">restart floor</text>
  <text x="48" y="1002" class="label">W = oracle concurrency</text>
  <text x="48" y="1026" class="label">N = inserter_pool_size</text>
</svg>
