<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="984" viewBox="0 0 1120 984" role="img" aria-labelledby="title desc">
  <title id="title">Greenfield bootstrap data paths</title>
  <desc id="desc">Physical backup is multiplexed to DiskLanderSink and PageWalkSink. PendingGate resolves row visibility before page rows enter a bootstrap insert tail at backup-start LSN. A concurrent WAL window has its own replay and insert tail at real commit LSNs. Finish both tails and start shadow through backup end before handing off streaming at end_lsn.</desc>
  <defs>
    <marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#A3A9CE" stroke-width="1.5"/></marker>
    <marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#E49B5D" stroke-width="1.5"/></marker>
    <marker id="catalog" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#85B695" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #ECE1D7; }
    .name { font-family: monospace; font-size: 19px; font-weight: 600; }
    .group { font-size: 19px; font-weight: 700; }
    .label { font-size: 17px; fill: #C1A78E; }
  </style>
  <rect width="1120" height="984" fill="#292522"/>
  <rect x="48" y="32" width="1024" height="80" fill="#273142" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="61" class="name">Source PostgreSQL</text>
  <text x="64" y="85" class="">BASE_BACKUP and concurrent physical WAL connection</text>
  <rect x="48" y="208" width="544" height="80" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="237" class="name">BackupSource → MultiplexSink</text>
  <text x="64" y="261" class="">Catalog seed selects files and relations</text>
  <rect x="704" y="208" width="368" height="106" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="720" y="237" class="name">SourceFeed → WalReplaySink</text>
  <text x="720" y="261" class="">Backup-window WAL</text>
  <text x="720" y="285" class="">Live stream or hydrated archive</text>
  <path d="M 320 112 V 208" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="336" y="165" class="label">BASE_BACKUP</text>
  <path d="M 888 112 V 208" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="904" y="165" class="label">WAL</text>
  <rect x="48" y="368" width="240" height="88" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="397" class="name">DiskLanderSink</text>
  <text x="64" y="421" class="">Catalog + recovery files</text>
  <rect x="352" y="368" width="240" height="88" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="368" y="397" class="name">PageWalkSink</text>
  <text x="368" y="421" class="">Heap pages → tuples</text>
  <path d="M 168 328 H 472" fill="none" stroke="#A3A9CE" stroke-width="1.5"/>
  <path d="M 320 288 V 328" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 168 328 V 368" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 472 328 V 368" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 48 532 C 48 516 288 516 288 532 V 596 C 288 612 48 612 48 596 Z M 48 532 C 48 548 288 548 288 532" fill="#422741" stroke="#CF9BC2" stroke-width="1.3"/>
  <text x="64" y="560" class="name">shadow_data_dir</text>
  <text x="64" y="586" class="">Catalog-only backup</text>
  <path d="M 168 456 V 520" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="352" y="520" width="240" height="88" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="368" y="549" class="name">PendingGate</text>
  <text x="368" y="573" class="">Resolve tuple visibility</text>
  <text x="368" y="597" class="">pg_xact + WAL outcomes</text>
  <path d="M 472 456 V 520" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 288 566 H 352" fill="none" stroke="#85B695" stroke-width="1.8" marker-end="url(#catalog)"/>
  <text x="320" y="549" class="label" text-anchor="middle">pg_xact</text>
  <path d="M 704 280 H 656 V 564 H 592" fill="none" stroke="#85B695" stroke-width="1.8" marker-end="url(#catalog)"/>
  <text x="642" y="504" class="label" text-anchor="end">PgXactPatch</text>
  <rect x="704" y="520" width="368" height="88" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="720" y="549" class="name">Window OwnedTail</text>
  <text x="720" y="573" class="">Batcher → inserters → ClickHouse</text>
  <text x="720" y="597" class="">_lsn = real commit position</text>
  <path d="M 888 314 V 520" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <text x="904" y="417" class="label">committed rows</text>
  <rect x="48" y="704" width="240" height="88" fill="#273142" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="733" class="name">Shadow PostgreSQL</text>
  <text x="64" y="757" class="">Replay through end_lsn</text>
  <rect x="352" y="704" width="240" height="88" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="368" y="733" class="name">Bootstrap OwnedTail</text>
  <text x="368" y="757" class="">ClickHouse INSERT pool</text>
  <text x="368" y="781" class="">_lsn = backup start</text>
  <path d="M 168 608 V 704" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <path d="M 472 608 V 704" fill="none" stroke="#A3A9CE" stroke-width="1.8" marker-end="url(#data)"/>
  <rect x="48" y="872" width="1024" height="80" fill="#292522" stroke="#867462" stroke-width="1.3"/>
  <text x="64" y="901" class="name">Bootstrap handoff</text>
  <text x="64" y="925" class="">Finish page + window INSERTs; shadow reaches backup end; start WAL pipeline at end_lsn</text>
  <path d="M 168 792 V 872" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <path d="M 472 792 V 872" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <path d="M 888 608 V 872" fill="none" stroke="#E49B5D" stroke-width="1.8" marker-end="url(#control)" stroke-dasharray="6 4"/>
  <text x="904" y="747" class="label">window tail drained</text>
</svg>
