[Service]
Environment=WALSHADOW_KEEP_SHADOW_RUNNING=true
KillMode=process
Restart=on-failure
# 65: deterministic fail-closed stop. The same WAL fails the same way on every
# restart, so leave the unit failed for an operator instead of looping; see
# docs/operations.md "Fail-closed stops"
RestartPreventExitStatus=65
