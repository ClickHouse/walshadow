# `cargo deny check`, over the Linux targets walshadow ships
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # webpki-roots' Mozilla root bundle
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # pglz, ported from PostgreSQL's pg_lzcompress.c
    "PostgreSQL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# Our own copyleft license, not acceptable for a dependency
exceptions = [{ crate = "walshadow", allow = ["AGPL-3.0-only"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
